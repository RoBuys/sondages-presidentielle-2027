name: Mise à jour des sondages et déploiement

on:
  schedule:
    # Tous les jours à 05:17 UTC (06:17 ou 07:17 à Paris selon la saison)
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tests du parseur
        run: python -I -m unittest discover -s tests

      - name: Récupérer les sondages
        run: python scripts/update_polls.py

      - name: Enregistrer les données si elles ont changé
        run: |
          if git diff --quiet -- site/data/polls.json; then
            echo "Aucun changement dans les données."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/polls.json
            git commit -m "Données : mise à jour automatique des sondages"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
